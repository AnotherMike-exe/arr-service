[project]
name = "arr-service"
version = "0.1.0"
description = "Pull, analyze, and push Sonarr/Radarr quality profile settings over the v3 API."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Plum Solutions" }]
dependencies = []

[project.urls]
Repository = "https://github.com/AnotherMike-exe/arr-service"

[project.scripts]
arr = "arr:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["arr_service"]
py-modules = ["arr"]

[tool.ruff]
# Matches the floor in requires-python; the code is stdlib-only and 3.9-compatible.
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
